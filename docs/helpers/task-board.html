<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Witcher LARP Core Engine Task Board</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --border: #d6dce8;
      --done: #15803d;
      --ready: #f97316;
      --blocked: #b91c1c;
      --working: #2563eb;
      --pending: #64748b;
      --focus: #2563eb;
    }
    * { box-sizing: border-box; }
    html {
      height: 100%;
    }
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      z-index: 10;
      flex: 0 0 auto;
      border-bottom: 1px solid var(--border);
      background: rgba(245, 247, 251, 0.96);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
    }
    .header-top {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }
    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
      letter-spacing: 0;
      white-space: nowrap;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 330px) auto minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      margin-top: 7px;
    }
    input[type="search"] {
      width: 100%;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 0 12px;
      font: inherit;
      outline: none;
    }
    input[type="search"]:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }
    .zoom-controls {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .zoom-button {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
    }
    .zoom-button:hover {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .zoom-label {
      min-width: 42px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }
    .stats, .filters {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .filters { margin-top: 6px; padding-bottom: 2px; }
    .filter-group {
      display: contents;
    }
    .filter-label {
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      min-height: 30px;
    }
    .stage-summary {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      margin-top: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
      padding-bottom: 2px;
    }
    .pill, .filter {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      min-height: 30px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
      padding: 6px 10px;
      white-space: nowrap;
    }
    .pill.compact {
      min-height: 26px;
      padding: 5px 9px;
    }
    .pill.status-ready {
      border-color: rgba(249, 115, 22, 0.62);
      background: #ffedd5;
      color: #9a3412;
      font-weight: 900;
    }
    .pill.status-working {
      border-color: rgba(37, 99, 235, 0.42);
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 900;
    }
    .pill.status-done {
      border-color: rgba(21, 128, 61, 0.38);
      background: #dcfce7;
      color: #166534;
      font-weight: 900;
    }
    .pill.status-blocked {
      border-color: rgba(185, 28, 28, 0.35);
      background: #fee2e2;
      color: #991b1b;
      font-weight: 900;
    }
    .pill.status-pending {
      border-color: rgba(100, 116, 139, 0.35);
      background: #f1f5f9;
      color: #475569;
      font-weight: 900;
    }
    .filter {
      cursor: pointer;
      color: var(--text);
    }
    .filter input { accent-color: var(--focus); }
    .filter-drawer {
      margin-top: 4px;
    }
    .filter-drawer summary {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      list-style: none;
      padding: 5px 10px;
      user-select: none;
      width: fit-content;
    }
    .filter-drawer summary::-webkit-details-marker {
      display: none;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 370px;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    main.details-closed {
      grid-template-columns: minmax(0, 1fr);
    }
    main.details-closed aside {
      display: none;
    }
    .board {
      min-height: 0;
      height: 100%;
      overflow: auto;
      padding: 24px;
      cursor: grab;
      overscroll-behavior: contain;
    }
    .board.dragging {
      cursor: grabbing;
      user-select: none;
    }
    .columns {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      min-width: max-content;
    }
    .column {
      width: 270px;
      flex: 0 0 270px;
    }
    .column h2 {
      position: sticky;
      top: 0;
      z-index: 2;
      margin: 0 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 8px 10px;
      text-transform: uppercase;
    }
    .card {
      position: relative;
      margin: 0 0 10px;
      border: 1px solid var(--border);
      border-left: 5px solid #94a3b8;
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.07);
      cursor: pointer;
      padding: 34px 10px 10px;
      user-select: none;
      overflow: hidden;
    }
    .card:hover, .card.selected {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16), 0 14px 32px rgba(15, 23, 42, 0.12);
    }
    .card.related {
      border-color: #60a5fa;
      box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.24), 0 12px 28px rgba(15, 23, 42, 0.10);
    }
    .card.dimmed {
      opacity: 0.34;
      filter: saturate(0.65);
      box-shadow: none;
    }
    .card.dimmed:hover {
      opacity: 0.72;
      filter: none;
    }
    .card.done {
      border-left-color: var(--done);
      border-color: rgba(21, 128, 61, 0.40);
      background: linear-gradient(135deg, #dcfce7 0%, #ffffff 72%);
    }
    .card.in_progress {
      border-left-color: var(--working);
      border-color: rgba(37, 99, 235, 0.42);
      background: linear-gradient(135deg, #dbeafe 0%, #ffffff 72%);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.18), 0 10px 26px rgba(30, 64, 175, 0.12);
    }
    .card.blocked {
      border-left-color: var(--blocked);
      border-color: rgba(185, 28, 28, 0.38);
      background: linear-gradient(135deg, #fee2e2 0%, #ffffff 72%);
    }
    .card.pending {
      border-left-color: var(--pending);
      background: linear-gradient(135deg, #f8fafc 0%, #ffffff 72%);
    }
    .card.dependency-ready {
      border-color: rgba(249, 115, 22, 0.72);
      border-left-color: var(--ready);
      background: linear-gradient(135deg, #fed7aa 0%, #fff7ed 48%, #ffffff 78%);
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.30), 0 14px 34px rgba(194, 65, 12, 0.18);
    }
    .status-ribbon {
      position: absolute;
      inset: 0 0 auto 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 24px;
      padding: 5px 10px;
      color: #ffffff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .status-ribbon.ready { background: var(--ready); }
    .status-ribbon.working { background: var(--working); }
    .status-ribbon.done { background: var(--done); }
    .status-ribbon.blocked { background: var(--blocked); }
    .status-ribbon.waiting { background: var(--pending); }
    .status-ribbon .status-id {
      opacity: 0.88;
    }
    .idline {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-bottom: 7px;
    }
    .title {
      min-height: 38px;
      font-size: 13px;
      line-height: 1.28;
    }
    .tags, .deps {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }
    .tag {
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
      padding: 4px 7px;
    }
    .tag.dependency-ready { background: #ffedd5; color: #9a3412; font-weight: 900; }
    .tag.done { color: var(--done); font-weight: 800; }
    .tag.in_progress { color: var(--working); font-weight: 800; }
    .tag.blocked { color: var(--blocked); font-weight: 800; }
    .tag.state { font-weight: 900; }
    .tag.state.ready { background: #ffedd5; color: #9a3412; }
    .tag.state.working { background: #dbeafe; color: #1d4ed8; }
    .tag.state.done { background: #dcfce7; color: #166534; }
    .tag.state.blocked { background: #fee2e2; color: #991b1b; }
    .tag.state.waiting { background: #f1f5f9; color: #475569; }
    .tag.stage { color: #2563eb; font-weight: 800; }
    .tag.stage-gate { color: #7c2d12; font-weight: 800; }
    .dep {
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      padding: 4px 6px;
    }
    .dep.done { background: #dcfce7; color: #166534; }
    .dep.in_progress { background: #ffedd5; color: #c2410c; }
    .dep.blocked { background: #fee2e2; color: #991b1b; }
    aside {
      overflow: auto;
      border-left: 1px solid var(--border);
      background: var(--panel);
      padding: 22px;
    }
    .details-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .details-close {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-soft);
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      line-height: 1;
    }
    .details-close:hover {
      border-color: var(--focus);
      color: var(--text);
    }
    aside h2 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.25;
    }
    aside p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .section {
      border-top: 1px solid var(--border);
      margin-top: 14px;
      padding-top: 14px;
    }
    .section h3 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    ul {
      margin: 0;
      padding-left: 18px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
    }
    .refresh-status {
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 980px) {
      .header-top { align-items: flex-start; flex-direction: column; gap: 2px; }
      .toolbar, main { grid-template-columns: 1fr; }
      .zoom-controls { justify-content: flex-start; }
      header { padding: 7px 10px; }
      aside { border-left: 0; border-top: 1px solid var(--border); }
      main.details-closed aside { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Witcher LARP Core Engine Task Board</h1>
      <p class="subtitle">Generated from tasks.json. Bright orange = can start, blue = in work, green = done, red = blocked, gray = waiting.</p>
    </div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search by id, title, stage, category, or dependency" />
      <div class="zoom-controls" aria-label="Board zoom controls">
        <button class="zoom-button" id="zoomOut" type="button" title="Zoom out">-</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button class="zoom-button" id="zoomIn" type="button" title="Zoom in">+</button>
      </div>
      <div>
        <div class="stats" id="stats"></div>
        <div class="stage-summary" id="stageSummary"></div>
        <details class="filter-drawer">
          <summary>Filters</summary>
          <div class="filters" id="filters"></div>
        </details>
        <div class="refresh-status" id="refreshStatus"></div>
      </div>
    </div>
  </header>
  <main id="layout">
    <section class="board" id="board">
      <div class="columns" id="columns"></div>
    </section>
    <aside id="details"></aside>
  </main>
  <script>
    const EMBEDDED_TASKS = [{"id":"TASK-000","title":"Подготовить TaskOS planning baseline","status":"done","priority":"P0","category":"planning","stage":"BASELINE: TaskOS Planning","stage_gate":false,"dependencies":[],"description":"Установить TaskOS-файлы и создать канонические документы планирования, связанные с core engine и техническим планом.","scope":["Инициализировать TaskOS в репозитории","Создать PRD, architecture, roadmap, tasks.json, kanban и dashboard","Связать TaskOS-документы с исходными core-engine и app-technical-plan","Зафиксировать uv project contract: pyproject.toml, .python-version, uv run commands and .venv ignore policy"],"acceptance":["TaskOS-команды работают через uv run python scripts/taskctl.py","Канонические документы существуют в docs/","tasks.json содержит dependency-aware задачи","Kanban и dashboard пересобраны","Python/tooling явно описаны как uv-managed, а ручные python -m venv/pip install не считаются каноном"],"test_steps":["uv run python scripts/taskctl.py validate","uv run python scripts/taskctl.py sync"],"notes":"Contract:\nInputs: Initial repo, historical core-engine source, technical plan and TaskOS setup.\nOutputs: Completed TaskOS baseline: tasks.json, taskos.toml, generated kanban/dashboard, AGENTS instructions and uv project contract.\nImplementation path: Keep as completed baseline; do not reopen unless TaskOS itself is replaced.\nInterfaces: Task state changes go only through uv run python scripts/taskctl.py claim/done/block/release/sync.\nFailure/review paths: If generated views diverge from tasks.json, rerun sync; if graph is invalid, fix tasks.json before implementation.\nRequired tests: uv run python -m json.tool tasks.json; uv run python scripts/taskctl.py validate; uv run python scripts/taskctl.py sync; uv run python scripts/taskctl.py doctor"},{"id":"TASK-001","title":"Провести platform и local network spike","status":"done","priority":"P0","category":"platform","stage":"STAGE-1: Core Game Engine","stage_gate":false,"dependencies":["TASK-000"],"description":"Проверить реальные устройства, камеру/QR capability и домашний Wi-Fi/LAN preflight до углубления в mobile runtime; exported Godot app smoke выполняется в TASK-007.","scope":["Device inventory/go-no-go: Android/iPhone models, OS versions, browser/camera availability, Mac/Xcode/free provisioning availability without requiring Godot app export","Камера/QR capability smoke через доступный browser/native camera path или явный launch-risk label до появления Godot shell","Доступ телефона/лордского ноутбука к local health URL или явный launch-risk/fallback label","uv-managed backend smoke: uv sync, uv run python -m backend.witcher_larp, /health reachable from phone and lord laptop","Document Python 3.12/uv version, .venv path, local IP/port, OS firewall and Wi-Fi client-isolation findings"],"acceptance":["Риски устройств и сети задокументированы с датой и моделями","Каждый blocker имеет fallback или launch-risk label","Platform spike не блокирует backend/content foundation","Exported Android/iOS Godot app smoke не является acceptance TASK-001 и перенесен в TASK-007","Local server launch path is documented through uv, not raw python/pip, and every device smoke references the same command contract"],"test_steps":["Start backend on 0.0.0.0 through uv run python -m backend.witcher_larp and open /health from master laptop loopback and LAN IP","Открыть local health URL с телефона и лордского ноутбука в Wi-Fi, если устройства доступны; иначе зафиксировать launch-risk/fallback label","Зафиксировать Android/iPhone/Mac/Xcode/free provisioning availability and QR/camera capability/go-no-go","uv run python scripts\\taskctl.py validate","Start backend through uv run python -m backend.witcher_larp and open /health from master laptop, lord laptop and phone in Wi-Fi","uv run python scripts/taskctl.py validate","uv run python scripts/taskctl.py sync","uv run python scripts/taskctl.py doctor","uv run python -m unittest discover -s tests -v","Phon ":false,"dependencies":["TASK-005","TASK-007","TASK-011"],"description":"Исправить утечки секретов и несостыковки auth/snapshot перед повторной приемкой Stage 1.","scope":["Player snapshot must be scoped by authenticated player_code and must never include player_codes or role_tokens for other roles","Lord/master role_tokens stay server-only and are never exported to mobile snapshots","Implement or align POST /api/auth/player-code with the Godot mobile login contract","Mobile snapshot refresh must pass the authenticated player_code/session scope instead of requesting a global snapshot","Master/lord APIs must reject missing or wrong role tokens where role authority is required","Add regression coverage proving leaked master/lord/player secrets are absent from every player snapshot"],"acceptance":["A witcher/sorceress/lord player snapshot contains only data visible to that player and no raw role_tokens table","Master/NPC tokens and other players' login codes cannot be obtained through /api/content/snapshot","Godot online login succeeds through the same player-code endpoint exposed by backend","Unauthenticated or wrong-token role API calls return an explicit auth error, not game state","Existing role-token login for lord/master panels remains working"],"test_steps":["Add API tests for scoped snapshots for at least one witcher, one sorceress and one lord","Add negative test that master/lord role_tokens and unrelated player_codes are absent from mobile snapshot JSON","Add player-code login API test and Godot contract/static test that the client calls the implemented route","Run uv run pytest tests/test_snapshot_exporter.py tests/test_fastapi_contract.py -q","Run uv run python scripts/taskctl.py validate","uv run pytest -q: 76 passed; uv run python scripts/taskctl.py validate: tasks.json is valid; uv run ruff check: unavailable because ruff is not installed in the project environment."],"notes":"Contract:\nInputs: TASK-005 snapshot/event sync, TASK-007 mobile shell, TASK-0     const PRIORITY_ORDER = ["P0", "P1", "P2", "P3"];

    function normalizeTasks(raw) {
      const list = Array.isArray(raw) ? raw : (raw?.tasks ?? []);
      return list.map((task) => ({
        id: task.id,
        title: task.title ?? "",
        status: task.status ?? "pending",
        priority: task.priority ?? "",
        category: task.category ?? "",
        stage: task.stage ?? "Unstaged",
        stage_gate: Boolean(task.stage_gate),
        dependencies: Array.isArray(task.dependencies) ? task.dependencies : [],
        description: task.description ?? "",
        scope: Array.isArray(task.scope) ? task.scope : [],
        acceptance: Array.isArray(task.acceptance) ? task.acceptance : (task.acceptance_criteria ?? []),
        test_steps: Array.isArray(task.test_steps) ? task.test_steps : [],
        notes: task.notes ?? "",
      }));
    }

    function priorityList(tasks) {
      return [...new Set([...PRIORITY_ORDER, ...tasks.map((task) => task.priority).filter(Boolean)])];
    }

    function stageList(tasks) {
      return [...new Set(tasks.map((task) => task.stage).filter(Boolean))];
    }

    function taskSignature(tasks) {
      return JSON.stringify(tasks);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function isReady(task) {
      return task.status === "pending" && task.dependencies.every((id) => byId.get(id)?.status === "done");
    }

    function executionState(task) {
      if (isReady(task)) return "ready";
      if (task.status === "in_progress") return "working";
      if (task.status === "done") return "done";
      if (task.status === "blocked") return "blocked";
      return "waiting";
    }

    function executionLabel(task) {
      const state = executionState(task);
      return {
        ready: "Can start",
        working: "In work",
        done: "Done",
        blocked: "Blocked",
        waiting: "Waiting",
      }[state] ?? state;
    }

    function loadZoom() {
      try {
        const value = Number(window.localStorage.getItem("taskBoardZoom"));
        return Number.isFinite(value) ? value : 1;
      } catch (error) {
        return 1;
      }
    }

    function setZoom(value) {
      boardZoom = Math.max(0.7, Math.min(1.4, Number(value) || 1));
      columnsEl.style.zoom = String(boardZoom);
      zoomLabelEl.textContent = `${Math.round(boardZoom * 100)}%`;
      try {
        window.localStorage.setItem("taskBoardZoom", String(boardZoom));
      } catch (error) {
        // Static file mode can deny storage; zoom still works for this session.
      }
    }

    function stepZoom(delta) {
      setZoom(Math.round((boardZoom + delta) * 10) / 10);
    }

    function relatedTaskIds(taskId) {
      const related = new Set();
      if (!taskId || !byId.has(taskId)) return related;
      related.add(taskId);

      function visitDependencies(id) {
        const task = byId.get(id);
        if (!task) return;
        for (const dependencyId of task.dependencies) {
          if (related.has(dependencyId)) continue;
          related.add(dependencyId);
          visitDependencies(dependencyId);
        }
      }

      function visitDependents(id) {
        for (const task of TASKS) {
          if (!task.dependencies.includes(id) || related.has(task.id)) continue;
          related.add(task.id);
          visitDependents(task.id);
        }
      }

      visitDependencies(taskId);
      visitDependents(taskId);
      return related;
    }

    function depthFor(task, memo = new Map(), visiting = new Set()) {
      if (memo.has(task.id)) return memo.get(task.id);
      if (visiting.has(task.id)) return 0;
      visiting.add(task.id);
      const depth = task.dependencies.length
        ? Math.max(...task.dependencies.map((id) => byId.has(id) ? depthFor(byId.get(id), memo, visiting) : 0)) + 1
        : 0;
      visiting.delete(task.id);
      memo.set(task.id, depth);
      return depth;
    }

    function visibleTasks() {
      const query = searchEl.value.trim().toLowerCase();
      return TASKS.filter((task) => {
        if (!selectedPriorities.has(task.priority)) return false;
        if (!selectedStages.has(task.stage)) return false;
        if (!query) return true;
        return `${task.id} ${task.title} ${task.stage} ${task.category} ${task.status} ${task.dependencies.join(" ")}`
          .toLowerCase()
          .includes(query);
      });
    }

    function renderStats() {
      let dependencyReady = 0;
      let gateDone = 0;
      let gateTotal = 0;
      const counts = TASKS.reduce((acc, task) => {
        acc[task.status] = (acc[task.status] ?? 0) + 1;
        if (isReady(task)) dependencyReady += 1;
        if (task.stage_gate) {
          gateTotal += 1;
          if (task.status === "done") gateDone += 1;
        }
        return acc;
      }, {});
      const waitingPending = Math.max(0, (counts.pending ?? 0) - dependencyReady);
      statsEl.innerHTML = [
        ["Can start", dependencyReady, "status-ready"],
        ["In work", counts.in_progress ?? 0, "status-working"],
        ["Done", counts.done ?? 0, "status-done"],
        ["Blocked", counts.blocked ?? 0, "status-blocked"],
        ["Waiting", waitingPending, "status-pending"],
        ["Total", TASKS.length, ""],
        ["Stage gates", `${gateDone}/${gateTotal}`, ""],
      ].map(([label, value, className]) => `<span class="pill compact ${className}">${label}: ${value}</span>`).join("");
      const stageRows = stages.map((stage) => {
        const stageTasks = TASKS.filter((task) => task.stage === stage);
        const done = stageTasks.filter((task) => task.status === "done").length;
        const gate = stageTasks.find((task) => task.stage_gate);
        const gateText = gate ? ` - gate ${gate.status}` : "";
        return `<span class="pill compact">${escapeHtml(stage)}: ${done}/${stageTasks.length}${gateText}</span>`;
      });
      stageSummaryEl.innerHTML = stageRows.join("");
    }

    function renderFilters() {
      const priorityFilters = priorities
        .map((priority) => `<label class="filter"><input type="checkbox" data-kind="priority" data-value="${escapeHtml(priority)}" ${selectedPriorities.has(priority) ? "checked" : ""} /> ${escapeHtml(priority)}</label>`)
        .join("");
      const stageFilters = stages
        .map((stage) => `<label class="filter"><input type="checkbox" data-kind="stage" data-value="${escapeHtml(stage)}" ${selectedStages.has(stage) ? "checked" : ""} /> ${escapeHtml(stage)}</label>`)
        .join("");
      filtersEl.innerHTML = `<span class="filter-label">Priority</span>${priorityFilters}<span class="filter-label">Stage</span>${stageFilters}`;
      filtersEl.querySelectorAll("input").forEach((input) => {
        input.addEventListener("change", () => {
          const target = input.dataset.kind === "stage" ? selectedStages : selectedPriorities;
          if (input.checked) target.add(input.dataset.value);
          else target.delete(input.dataset.value);
          render();
        });
      });
    }

        ? `<div class="deps">${task.dependencies.map((id) => {
            const depStatus = byId.get(id)?.status ?? "missing";
            return `<span class="dep ${escapeHtml(depStatus)}">${escapeHtml(id)}</span>`;
          }).join("")}</div>`
        : "";
      return `<article class="card ${escapeHtml(status)} ${ready ? "dependency-ready" : ""} ${selected ? "selected" : ""} ${related && !selected ? "related" : ""} ${dimmed ? "dimmed" : ""}" data-id="${escapeHtml(task.id)}">
        <div class="status-ribbon ${escapeHtml(state)}"><span>${escapeHtml(stateLabel)}</span><span class="status-id">${escapeHtml(task.status)}</span></div>
        <div class="idline"><span>${escapeHtml(task.id)}</span><span>${escapeHtml(task.priority)}</span></div>
        <div class="title">${escapeHtml(task.title)}</div>
        <div class="tags">
          <span class="tag state ${escapeHtml(state)}">${escapeHtml(stateLabel)}</span>
          <span class="tag ${escapeHtml(status)}">${escapeHtml(status)}</span>
          ${ready ? `<span class="tag dependency-ready">dependency-ready</span>` : ""}
          ${task.stage_gate ? `<span class="tag stage-gate">stage gate</span>` : ""}
          <span class="tag stage">${escapeHtml(task.stage)}</span>
          <span class="tag">${escapeHtml(task.category)}</span>
        </div>
        ${deps}
      </article>`;
    }

    function renderColumns() {
      const memo = new Map();
      const groups = new Map();
      const relatedIds = detailsOpen && selectedId ? relatedTaskIds(selectedId) : null;
      for (const task of visibleTasks()) {
        const depth = depthFor(task, memo);
        if (!groups.has(depth)) groups.set(depth, []);
        groups.get(depth).push(task);
      }
      columnsEl.innerHTML = [...groups.entries()]
        .sort((a, b) => a[0] - b[0])
        .map(([depth, tasks]) => `<section class="column"><h2>Layer ${depth}</h2>${tasks.map((task) => renderCard(task, relatedIds)).join("")}</section>`)
        .join("");
      columnsEl.querySelectorAll(".card").forEach((card) => {
        card.addEventListener("click", () => {
          if (suppressCardClick) return;
          if (detailsOpen && selectedId === card.dataset.id) {
            detailsOpen = false;
          } else {
            selectedId = card.dataset.id;
            detailsOpen = true;
          }
          render();
        });
      });
    }

    function section(title, values) {
      if (!values || (Array.isArray(values) && values.length === 0)) return "";
      const items = Array.isArray(values) ? values : [values];
      return `<div class="section"><h3>${escapeHtml(title)}</h3><ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul></div>`;
    }

    function renderDetails() {
      if (!detailsOpen) {
        detailsEl.innerHTML = "";
        return;
      }
      const task = byId.get(selectedId);
      if (!task) {
        detailsOpen = false;
        detailsEl.innerHTML = "";
        layoutEl.classList.add("details-closed");
        return;
      }
      const ready = isReady(task);
      const state = executionState(task);
      const stateLabel = executionLabel(task);
      detailsEl.innerHTML = `<div class="details-header">
          <h2>${escapeHtml(task.id)} - ${escapeHtml(task.title)}</h2>
          <button class="details-close" type="button" aria-label="Close details">x</button>
        </div>
        <p>${escapeHtml(task.description || "No description.")}</p>
        <div class="tags">
          <span class="tag state ${escapeHtml(state)}">${escapeHtml(stateLabel)}</span>
          <span class="tag ${escapeHtml(task.status)}">${escapeHtml(task.status)}</span>
          ${ready ? `<span class="tag dependency-ready">dependency-ready</span>` : ""}
          ${task.stage_gate ? `<span class="tag stage-gate">stage gate</span>` : ""}
          <span class="tag">${escapeHtml(task.priority)}</span>
          <span class="tag stage">${escapeHtml(task.stage)}</span>
          <span class="tag">${escapeHtml(task.category)}</span>
        </div>
        ${section("Stage", [task.stage, task.stage_gate ? "Stage gate" : "Regular task"])}
        ${section("Dependencies", task.dependencies.length ? task.dependencies : ["None"])}
        ${section("Scope", task.scope)}
        ${section("Acceptance", task.acceptance)}
        ${section("Test Steps", task.test_steps)}
        ${section("Notes", task.notes ? [task.notes] : [])}`;
      detailsEl.querySelector(".details-close")?.addEventListener("click", () => {
        detailsOpen = false;
        render();
      });
    }

    function render() {
      layoutEl.classList.toggle("details-closed", !detailsOpen);
      renderStats();
      renderColumns();
      renderDetails();
    }

    function setRefreshStatus(value) {
      if (refreshStatusEl) refreshStatusEl.textContent = value;
    }

    function updateTasks(raw) {
      const nextTasks = normalizeTasks(raw);
      const nextSignature = taskSignature(nextTasks);
      if (nextSignature === lastTaskSignature) return false;

      const previousScrollLeft = boardEl.scrollLeft;
      const previousScrollTop = boardEl.scrollTop;
      const previousSelectedPriorities = new Set(selectedPriorities);
      const previousSelectedStages = new Set(selectedStages);
      TASKS = nextTasks;
      byId = new Map(TASKS.map((task) => [task.id, task]));
      priorities = priorityList(TASKS);
      stages = stageList(TASKS);
      selectedPriorities.clear();
      for (const priority of priorities) {
        if (previousSelectedPriorities.size === 0 || previousSelectedPriorities.has(priority)) {
          selectedPriorities.add(priority);
        }
      }
      selectedStages.clear();
      for (const stage of stages) {
        if (previousSelectedStages.size === 0 || previousSelectedStages.has(stage)) {
          selectedStages.add(stage);
        }
      }
      if (selectedId && !byId.has(selectedId)) {
        selectedId = "";
        detailsOpen = false;
      }
      if (detailsOpen && !selectedId) detailsOpen = false;
      lastTaskSignature = nextSignature;
      renderFilters();
      render();
      const maxLeft = Math.max(0, boardEl.scrollWidth - boardEl.clientWidth);
      const maxTop = Math.max(0, boardEl.scrollHeight - boardEl.clientHeight);
      boardEl.scrollLeft = Math.min(previousScrollLeft, maxLeft);
      boardEl.scrollTop = Math.min(previousScrollTop, maxTop);
      return true;
    }

    async function refreshFromTasksFile() {
      const url = new URL(TASKS_FILE, window.location.href);
      url.searchParams.set("v", String(Date.now()));
      try {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const changed = updateTasks(await response.json());
        fetchFailureCount = 0;
        setRefreshStatus(changed ? "Auto-refresh: updated" : "Auto-refresh: synced");
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "taskboard:live-refresh" }, "*");
        }
      } catch (error) {
        fetchFailureCount += 1;
        setRefreshStatus("Auto-refresh: static file mode");
      }
    }

    function enableBoardDrag() {
      let isDown = false;
      let hasDragged = false;
      let startX = 0;
      let startY = 0;
      let startScrollLeft = 0;
      let startScrollTop = 0;

      boardEl.addEventListener("mousedown", (event) => {
        if (event.button !== 0) return;
        if (event.target.closest("input, button, label, textarea, select")) return;
        isDown = true;
        hasDragged = false;
        startX = event.clientX;
        startY = event.clientY;
        startScrollLeft = boardEl.scrollLeft;
        startScrollTop = boardEl.scrollTop;
        boardEl.classList.add("dragging");
      });

      window.addEventListener("mousemove", (event) => {
        if (!isDown) return;
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) hasDragged = true;
        if (!hasDragged) return;
        event.preventDefault();
        boardEl.scrollLeft = startScrollLeft - dx;
        boardEl.scrollTop = startScrollTop - dy;
      });

      window.addEventListener("mouseup", () => {
        if (!isDown) return;
        isDown = false;
        boardEl.classList.remove("dragging");
        if (hasDragged) {
          suppressCardClick = true;
          window.setTimeout(() => {
            suppressCardClick = false;
          }, 0);
        }
      });
    }

    searchEl.addEventListener("input", render);
    zoomOutEl.addEventListener("click", () => stepZoom(-0.1));
    zoomInEl.addEventListener("click", () => stepZoom(0.1));
    enableBoardDrag();
    setZoom(boardZoom);
    renderFilters();
    render();
    refreshFromTasksFile();
    window.setInterval(refreshFromTasksFile, 3000);
  </script>
</body>
</html>
