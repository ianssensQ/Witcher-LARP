<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Witcher LARP Core Engine Task Board</title>
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    body {
      overflow: hidden;
      background: #f5f7fb;
    }
    iframe {
      display: block;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe id="taskBoardFrame" title="Witcher LARP Core Engine Task Board"></iframe>
  <script>
    const frame = document.querySelector("#taskBoardFrame");
    const iframeSrc = "helpers/task-board.html";

    function loadFrame() {
      frame.src = iframeSrc + "?v=" + Date.now();
    }

    loadFrame();
  </script>
</body>
</html>
